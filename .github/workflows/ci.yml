name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only torch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2

      - name: Install package
        run: |
          pip install -e ".[dev]"

      - name: Prepare data
        run: python scripts/prepare_data.py

      - name: Train model
        run: python scripts/train_model.py

      - name: Evaluate
        run: python scripts/evaluate.py

      - name: Run tests
        run: pytest -v

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Build image
        run: docker build -t ca-housing:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 ca-housing:${{ github.sha }}
          sleep 15
          curl --fail http://localhost:8000/health
          curl --fail -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"MedInc": 8.3252, "HouseAge": 41, "AveRooms": 6.984127,
                 "AveBedrms": 1.02381, "Population": 322, "AveOccup": 2.555556,
                 "Latitude": 37.88, "Longitude": -122.23}'
          docker stop api

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only torch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2

      - name: Install package
        run: |
          pip install -e ".[dev]"

      - name: Prepare data
        run: python scripts/prepare_data.py

      - name: Train model
        run: python scripts/train_model.py

      - name: Build reference stats
        run: python scripts/reference_stats.py

      - name: Evaluate
        run: python scripts/evaluate.py

      - name: Run tests
        run: pytest -v

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/

  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 $IMAGE:${{ github.sha }}
          sleep 20
          curl --fail http://localhost:8000/health
          curl --fail -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"MedInc": 8.3252, "HouseAge": 41, "AveRooms": 6.984127, "AveBedrms": 1.02381, "Population": 322, "AveOccup": 2.555556, "Latitude": 37.88, "Longitude": -122.23}'
          curl --fail http://localhost:8000/metrics -o /dev/null
          curl --fail http://localhost:8000/drift
          docker stop api

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
